name: Music server
on:
  pull_request:
    paths: ['music-server/**', '.github/workflows/music-server.yml']
  push:
    branches: ['feature/music-server-v0.1']
    paths: ['music-server/**', '.github/workflows/music-server.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: music-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
